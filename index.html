<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>iOS Tasks — Али Алиев</title>
  
  <!-- Apple Web App Metadata for "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <meta name="theme-color" content="#000000">

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href='data:application/manifest+json,{"name":"iOS Tasks","short_name":"Tasks","start_url":".","display":"standalone","background_color":"#000000","theme_color":"#000000","icons":[{"src":"https://img.icons8.com/ios-filled/500/007AFF/checkmark--v1.png","sizes":"500x500","type":"image/png"}]}'>
  <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/500/007AFF/checkmark--v1.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Helvetica Neue"', 'sans-serif'],
          },
          colors: {
            ios: {
              blue: '#007AFF',
              green: '#34C759',
              red: '#FF3B30',
              orange: '#FF9500',
              yellow: '#FFCC00',
              purple: '#AF52DE',
            }
          },
          transitionTimingFunction: {
            'ios-spring': 'cubic-bezier(0.16, 1, 0.3, 1)',
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Glassmorphism and iOS Theme Variables */
    :root {
      --bg-main: #000000;
      --bg-card: rgba(28, 28, 30, 0.75);
      --bg-card-solid: #1c1c1e;
      --bg-glass: rgba(20, 20, 22, 0.82);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-sub: #8e8e93;
      --blur-strength: blur(25px) saturate(180%);
    }

    [data-theme="light"] {
      --bg-main: #f2f2f7;
      --bg-card: rgba(255, 255, 255, 0.82);
      --bg-card-solid: #ffffff;
      --bg-glass: rgba(248, 248, 250, 0.85);
      --border-glass: rgba(0, 0, 0, 0.08);
      --text-main: #1c1c1e;
      --text-sub: #6e6e73;
      --blur-strength: blur(25px) saturate(180%);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: var(--blur-strength);
      -webkit-backdrop-filter: var(--blur-strength);
      border: 1px solid var(--border-glass);
    }

    .glass-nav {
      background: var(--bg-glass);
      backdrop-filter: var(--blur-strength);
      -webkit-backdrop-filter: var(--blur-strength);
      border-bottom: 1px solid var(--border-glass);
    }

    /* Task Strikethrough Animation */
    .task-title {
      position: relative;
      transition: color 0.3s ease;
    }
    
    .task-title::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 0%;
      height: 2px;
      background-color: var(--text-sub);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .task-completed .task-title::after {
      width: 100%;
    }

    .task-completed .task-title {
      color: var(--text-sub);
    }

    /* Interactive iOS Touch Feedback */
    .ios-btn {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease, background-color 0.2s ease;
    }
    .ios-btn:active {
      transform: scale(0.95);
    }

    /* Checkbox Bounce Animation */
    .checkbox-spring {
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease, border-color 0.2s ease;
    }
    .checkbox-spring:active {
      transform: scale(0.82);
    }

    /* Scrollbar Removal */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>

  <!-- JavaScript App Logic -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('ios_tasks')) || [
      { id: '1', title: 'Опубликовать обзор на Saffron Fast Food', category: '🍕 Еда', priority: 'high', completed: true },
      { id: '2', title: 'Добавить интерактивный To-Do на GitHub', category: '🛠 Работа', priority: 'medium', completed: false }
    ];

    let currentFilter = 'all';
    let currentCategory = 'all';

    // Theme Switch Logic
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('ios_theme', next);
      document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
    }

    (function initTheme() {
      const savedTheme = localStorage.getItem('ios_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    })();

    function saveTasks() {
      localStorage.setItem('ios_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function addTask() {
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) return;

      const category = document.getElementById('category-select').value;
      const priority = document.getElementById('priority-select').value;

      const newTask = {
        id: Date.now().toString(),
        title: title,
        category: category,
        priority: priority,
        completed: false
      };

      tasks.unshift(newTask);
      input.value = '';
      saveTasks();
    }

    document.getElementById('task-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      if (navigator.vibrate) navigator.vibrate(15);
      saveTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('opacity-100', 'border-ios-blue', 'text-ios-blue');
        btn.classList.add('opacity-60');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.remove('opacity-60');
        activeBtn.classList.add('opacity-100', 'border-ios-blue', 'text-ios-blue');
      }
      renderTasks();
    }

    function setCategoryFilter(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('opacity-100', 'border-ios-blue', 'text-ios-blue');
        btn.classList.add('opacity-60');
      });
      event.target.classList.remove('opacity-60');
      event.target.classList.add('opacity-100', 'border-ios-blue', 'text-ios-blue');
      renderTasks();
    }

    function getPriorityBadge(priority) {
      switch (priority) {
        case 'high': return '<span class="w-2 h-2 rounded-full bg-ios-red inline-block" title="Высокий"></span>';
        case 'medium': return '<span class="w-2 h-2 rounded-full bg-ios-yellow inline-block" title="Средний"></span>';
        case 'low': return '<span class="w-2 h-2 rounded-full bg-ios-green inline-block" title="Низкий"></span>';
        default: return '';
      }
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';

      let filtered = tasks.filter(t => {
        if (currentFilter === 'active') return !t.completed;
        if (currentFilter === 'completed') return t.completed;
        return true;
      });

      if (currentCategory !== 'all') {
        filtered = filtered.filter(t => t.category === currentCategory);
      }

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
      }

      filtered.forEach(task => {
        const card = document.createElement('div');
        card.className = `glass-panel rounded-2xl p-4 shadow-lg flex items-center justify-between gap-3 transition-all duration-300 ${task.completed ? 'task-completed opacity-60' : ''}`;
        
        card.innerHTML = `
          <div class="flex items-center gap-3.5 flex-grow min-w-0">
            <button onclick="toggleTask('${task.id}')" class="checkbox-spring w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-ios-blue border-ios-blue text-white' : 'border-neutral-400 dark:border-neutral-500'} flex items-center justify-center shrink-0">
              ${task.completed ? '<span class="text-xs font-black">✓</span>' : ''}
            </button>

            <div class="flex flex-col min-w-0 flex-grow cursor-pointer" onclick="toggleTask('${task.id}')">
              <span class="task-title font-semibold text-base tracking-tight truncate">${task.title}</span>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-lg bg-black/5 dark:bg-white/10 text-neutral-400">${task.category}</span>
                ${getPriorityBadge(task.priority)}
              </div>
            </div>
          </div>

          <button onclick="deleteTask('${task.id}')" class="ios-btn p-2 text-neutral-400 hover:text-ios-red text-base shrink-0">
            ✕
          </button>
        `;

        container.appendChild(card);
      });
    }

    renderTasks();
  </script>
